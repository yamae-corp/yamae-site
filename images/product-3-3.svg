<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 266" width="100%">
  <rect width="452" height="266" fill="#f0eee8"/>
  <!-- Silicone rubber parts - rounded, flexible shapes -->
  <ellipse cx="120" cy="110" rx="70" ry="55" fill="#e8c8a0" stroke="#c8a880" stroke-width="1.5"/>
  <ellipse cx="120" cy="110" rx="50" ry="38" fill="#f0d4b0" stroke="#d4b890" stroke-width="1"/>
  <!-- O-ring shape -->
  <ellipse cx="290" cy="100" rx="75" ry="65" fill="none" stroke="#e8c8a0" stroke-width="18"/>
  <ellipse cx="290" cy="100" rx="75" ry="65" fill="none" stroke="#d4b480" stroke-width="2"/>
  <!-- Small gasket -->
  <rect x="80" y="178" width="100" height="50" rx="10" fill="#e8c8a0" stroke="#c8a880" stroke-width="1.5"/>
  <rect x="90" y="188" width="80" height="30" rx="6" fill="#f0d4b0"/>
  <!-- Strip/gasket on right -->
  <rect x="360" y="60" width="30" height="160" rx="8" fill="#e8c8a0" stroke="#c8a880" stroke-width="1.5"/>
  <!-- Label -->
  <rect x="116" y="228" width="220" height="30" rx="4" fill="white" opacity="0.88"/>
  <text x="226" y="248" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#5a4020" font-weight="bold">シリコンゴム成形品</text>
</svg>
