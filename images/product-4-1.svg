<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 266" width="100%">
  <rect width="452" height="266" fill="#f2f4f0"/>
  <!-- Pipe system workbench -->
  <!-- Legs (vertical pipes) -->
  <rect x="70" y="90" width="10" height="150" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <rect x="200" y="90" width="10" height="150" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <rect x="330" y="90" width="10" height="150" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <!-- Back legs -->
  <rect x="80" y="100" width="8" height="140" rx="2" fill="#6a8090" stroke="#507080" stroke-width="1" opacity="0.7"/>
  <rect x="340" y="100" width="8" height="140" rx="2" fill="#6a8090" stroke="#507080" stroke-width="1" opacity="0.7"/>
  <!-- Horizontal pipes - top shelf frame -->
  <rect x="65" y="90" width="280" height="10" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <!-- Top surface (work surface) -->
  <rect x="60" y="80" width="292" height="18" rx="2" fill="#b8c4c0" stroke="#90a0a0" stroke-width="1.5"/>
  <!-- Middle shelf horizontal pipes -->
  <rect x="65" y="170" width="280" height="8" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <!-- Middle shelf surface -->
  <rect x="60" y="163" width="292" height="14" rx="2" fill="#c8d0cc" stroke="#90a0a0" stroke-width="1"/>
  <!-- Bottom cross bars -->
  <rect x="65" y="225" width="280" height="7" rx="3" fill="#8090a0" stroke="#607080" stroke-width="1"/>
  <!-- Connector joints (circles at intersections) -->
  <circle cx="75" cy="95" r="7" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="205" cy="95" r="7" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="335" cy="95" r="7" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="75" cy="174" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="205" cy="174" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="335" cy="174" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <!-- Label -->
  <rect x="96" y="30" width="260" height="36" rx="4" fill="white" opacity="0.88"/>
  <text x="226" y="50" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#304050" font-weight="bold">組立パイプシステム</text>
  <text x="226" y="64" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#506070">作業台</text>
</svg>
