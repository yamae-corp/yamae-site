<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 266" width="100%">
  <rect width="452" height="266" fill="#f2f4f0"/>
  <!-- Rack / Cart with pipe system -->
  <!-- Frame outer -->
  <rect x="50" y="30" width="352" height="200" rx="4" fill="none" stroke="#8090a0" stroke-width="2"/>
  <!-- Vertical dividers -->
  <line x1="167" y1="30" x2="167" y2="230" stroke="#8090a0" stroke-width="2"/>
  <line x1="284" y1="30" x2="284" y2="230" stroke="#8090a0" stroke-width="2"/>
  <!-- Horizontal shelves -->
  <line x1="50" y1="80" x2="402" y2="80" stroke="#8090a0" stroke-width="2"/>
  <line x1="50" y1="130" x2="402" y2="130" stroke="#8090a0" stroke-width="2"/>
  <line x1="50" y1="180" x2="402" y2="180" stroke="#8090a0" stroke-width="2"/>
  <!-- Shelf surfaces -->
  <rect x="51" y="31" width="115" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="168" y="31" width="115" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <rect x="285" y="31" width="116" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="51" y="81" width="115" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <rect x="168" y="81" width="115" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="285" y="81" width="116" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <rect x="51" y="131" width="115" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="168" y="131" width="115" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <rect x="285" y="131" width="116" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="51" y="181" width="115" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <rect x="168" y="181" width="115" height="48" rx="1" fill="#dde4e0" opacity="0.5"/>
  <rect x="285" y="181" width="116" height="48" rx="1" fill="#d8e0dc" opacity="0.5"/>
  <!-- Connector joints -->
  <circle cx="50" cy="30" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="167" cy="30" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="284" cy="30" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="402" cy="30" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="50" cy="230" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <circle cx="402" cy="230" r="6" fill="#607080" stroke="#405060" stroke-width="1"/>
  <!-- Wheels -->
  <circle cx="70" cy="244" r="10" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <circle cx="382" cy="244" r="10" fill="#506070" stroke="#304050" stroke-width="1.5"/>
  <!-- Label -->
  <rect x="131" y="238" width="190" height="24" rx="4" fill="white" opacity="0.9"/>
  <text x="226" y="255" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#304050" font-weight="bold">組立パイプラック・台車</text>
</svg>
